name: Daily Stock Brief

on:
  schedule:
    # 04:45 UTC (12:45 PM SGT), Mon–Fri. GitHub has been starting scheduled
    # runs ~9 hours late (13 Nov: 08:45 cron ran 16:44-18:56), so this fires
    # early and the job waits for the 9:30 AM New York open (wait_for_open.py,
    # DST-aware, wait capped below the 6-hour job limit).
    - cron: '45 4 * * 1-5'
  workflow_dispatch:
    inputs:
      chat_id:
        description: 'Override Telegram chat ID (optional)'
        required: false
        default: ''

jobs:
  send-brief:
    runs-on: ubuntu-latest
    # Up to 5h45m waiting for the open (GitHub's maximum is 360)
    timeout-minutes: 360

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for the US market open
        if: github.event_name == 'schedule'
        run: python wait_for_open.py

      # The wait can last hours: pick up watchlist edits made meanwhile
      - name: Refresh to latest main
        if: github.event_name == 'schedule'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Send daily brief
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ github.event.inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python bot.py
